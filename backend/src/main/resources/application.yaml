spring:
  application:
    name: it-helpdesk

  # Local run (IntelliJ / bootRun): Postgres from docker-compose on localhost:5434.
  # ${NAME:default} reads an environment variable, or uses the default (same values as .env.example).
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5434}/${POSTGRES_DB:ItHelpDesk}
    username: ${POSTGRES_USER:user}
    password: ${POSTGRES_PASSWORD:pwd}

  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      # "update" keeps tickets, incidents and feedback across restarts.
      # Set JPA_DDL_AUTO=create to deliberately wipe and rebuild the schema.
      ddl-auto: ${JPA_DDL_AUTO:update}
    # Run data.sql only after Hibernate has created the tables
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      # "optional:" = don't crash if data.sql doesn't exist yet
      data-locations: classpath:data.sql
      schema-locations: classpath:schema.sql

  # When you run the app locally, Spring starts db and pgAdmin from docker-compose.yml
  # (repo root) if Docker is running. The "app" service is skipped (it's behind a compose profile).
  docker:
    compose:
      lifecycle-management: start-only   # leave the containers running when the app stops

  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 12MB

server:
  # Hosting platforms (Render, Railway...) tell the app which port to use via PORT.
  port: ${PORT:8080}
  error:
    include-message: always

tiqnest:
  cors:
    # Comma-separated list of frontend URLs allowed to call the API.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # TiqVision / IT-scope triage. The key is read from the environment on the server only.
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-opus-5-5}
    timeout-seconds: ${ANTHROPIC_TIMEOUT_SECONDS:45}
    max-retries: 2
    max-tokens: 8000
  triage:
    max-files: 4
    max-file-bytes: 3670016      # 3.5 MB per image
    max-total-bytes: 10485760    # 10 MB per request
    max-requests-per-minute: 12
    # Explicitly labelled presentation fixtures (never presented as real analysis)
    demo-fixtures-enabled: ${TIQNEST_DEMO_FIXTURES:false}

outage-radar:
  threshold: 3
  window-minutes: 5

sla:
  hours:
    critical: 1
    high: 4
    medium: 24
    low: 72

logging:
  level:
    root: INFO
    com.konate: DEBUG
    org.hibernate.SQL: DEBUG
    # TRACE prints every SQL parameter (passwords, ticket text). Opt in with SQL_BIND_LOG_LEVEL=TRACE.
    org.hibernate.orm.jdbc.bind: ${SQL_BIND_LOG_LEVEL:INFO}

---
# Docker profile: used when the app runs inside docker-compose
# (SPRING_PROFILES_ACTIVE=docker). The database host is the compose service
# name "db" and the internal port is 5432.
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://db:5432/${POSTGRES_DB:ItHelpDesk}
    hikari:
      # Wait up to 60 s for Postgres to be ready
      initialization-fail-timeout: 60000

---
# Test profile: in-memory H2 database, no seed data
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  sql:
    init:
      mode: never

# Tests never call the real AI provider, even if ANTHROPIC_API_KEY is set
tiqnest:
  ai:
    api-key: ""
