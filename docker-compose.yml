# Local services for the IT help desk.
# Values come from .env (copy .env.example to .env); ${NAME:-default} uses the default if not set.
#
#   docker compose up -d                        -> database + pgAdmin (run the app from IntelliJ)
#   docker compose --profile app up -d --build  -> database + pgAdmin + the app in a container
#
# If the app is running in IntelliJ, stop it before using the "app" profile (both use port 8080).

services:
  app:
    profiles: ["app"]          # only started with --profile app
    build:
      context: .               # repo root, so the Dockerfile can see settings.gradle and backend/
      dockerfile: Dockerfile
    container_name: ithelpdesk-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DB: ${POSTGRES_DB:-ItHelpDesk}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pwd}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: ithelpdesk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ItHelpDesk}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pwd}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"   # 5434 on your computer, so it doesn't clash with a local Postgres
    volumes:
      - db-data:/var/lib/postgresql/data   # keeps your data when the container restarts
    healthcheck:
      # $$ escapes the $ so the variable is read inside the container, not by Compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: ithelpdesk-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@hackathon2026.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-adminpassword}
    ports:
      - "9000:80"              # open http://localhost:9000
    depends_on:
      - db

volumes:
  db-data:
